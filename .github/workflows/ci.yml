name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_DB: solarmind
          POSTGRES_USER: solarmind
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U solarmind" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      # Throwaway credentials for the ephemeral CI services above.
      POSTGRES_USER: solarmind
      POSTGRES_PASSWORD: ci-only-password
      SOLARMIND_APP_DB_PASSWORD: ci-only-app-password
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy apps/api/src packages apps/simulator/src
      - run: uv run pytest -q
      - name: Dependency audit
        run: uvx pip-audit --requirement <(uv export --all-packages --no-dev --no-emit-workspace --format requirements-txt --no-hashes) --disable-pip
