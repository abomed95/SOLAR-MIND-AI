[project]
name = "solarmind-api"
version = "0.1.0"
description = "SOLAR MIND AI - REST API and worker (modular monolith)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "solarmind-schemas", "solarmind-energy", "solarmind-agents", "solarmind-adapters",
    "fastapi>=0.115,<0.116", "uvicorn[standard]>=0.32,<0.33", "pydantic[email]>=2.9,<3",
    "pydantic-settings>=2.6,<3", "sqlalchemy[asyncio]>=2.0.36,<2.1", "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2", "redis>=5.2,<6", "argon2-cffi>=23.1", "pyotp>=2.9,<3",
    "cryptography>=43", "reportlab>=4.2,<5", "aiomqtt>=2.3,<3", "python-multipart>=0.0.12",
    "minio>=7.2,<8", "psycopg[binary]>=3.2,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solarmind_api"]

[tool.uv.sources]
solarmind-schemas = { workspace = true }
solarmind-energy = { workspace = true }
solarmind-agents = { workspace = true }
solarmind-adapters = { workspace = true }
