[project]
name = "solarmind-simulator"
version = "0.1.0"
description = "Solar plant simulator and demo gateway"
requires-python = ">=3.12,<3.13"
dependencies = ["solarmind-schemas", "solarmind-adapters", "httpx>=0.27,<0.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solarmind_simulator"]

[tool.uv.sources]
solarmind-schemas = { workspace = true }
solarmind-adapters = { workspace = true }
