# Development stack. See docs/deployment/docker.md.
name: solar-mind-ai

x-python: &python
  build:
    context: .
    dockerfile: infrastructure/docker/python.Dockerfile
  image: solar-mind-ai-python

x-app-env: &app-env
  SOLARMIND_ENVIRONMENT: ${SOLARMIND_ENVIRONMENT:-development}
  SOLARMIND_LOG_LEVEL: ${SOLARMIND_LOG_LEVEL:-INFO}
  SOLARMIND_DATABASE_URL: postgresql+asyncpg://solarmind_app:${SOLARMIND_APP_DB_PASSWORD:?set SOLARMIND_APP_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB}
  SOLARMIND_REDIS_URL: redis://redis:6379/0
  SOLARMIND_SECRET_KEY: ${SOLARMIND_SECRET_KEY:?set SOLARMIND_SECRET_KEY in .env}
  SOLARMIND_COOKIE_SECURE: ${SOLARMIND_COOKIE_SECURE:-false}
  SOLARMIND_WEB_BASE_URL: ${SOLARMIND_WEB_BASE_URL:-http://localhost:3000}

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  migrate:
    <<: *python
    command: ["alembic", "-c", "database/alembic.ini", "upgrade", "head"]
    environment:
      SOLARMIND_MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SOLARMIND_APP_DB_PASSWORD: ${SOLARMIND_APP_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *python
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

volumes:
  postgres-data:
  redis-data:
