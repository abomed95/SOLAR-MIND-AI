# Two broker accounts, created at container start from environment variables:
#   worker  - the platform; may only READ telemetry topics
#   gateway - shared by edge gateways; may only WRITE telemetry topics
# Gateways therefore cannot read each other's messages. Each message is
# additionally authenticated by the gateway's own API key (checked by the
# worker), so the shared broker password alone cannot inject data.
# TLS: terminate on a dedicated listener in production (docs/deployment/production.md).
listener 1883
allow_anonymous false
password_file /mosquitto/run/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
