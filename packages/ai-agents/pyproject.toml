[project]
name = "solarmind-agents"
version = "0.1.0"
description = "Six analysis agents and the LLM abstraction"
requires-python = ">=3.12,<3.13"
dependencies = ["solarmind-schemas", "solarmind-energy", "scikit-learn>=1.5,<2", "numpy>=2.1,<3", "httpx>=0.27,<0.29", "pydantic>=2.9,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solarmind_agents"]

[tool.uv.sources]
solarmind-schemas = { workspace = true }
solarmind-energy = { workspace = true }
