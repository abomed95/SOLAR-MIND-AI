[project]
name = "solarmind-schemas"
version = "0.1.0"
description = "Canonical telemetry schemas and metric registry"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solarmind_schemas"]

