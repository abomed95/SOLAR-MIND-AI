[project]
name = "solar-mind-ai"
version = "0.1.0"
description = "SOLAR MIND AI workspace"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/simulator", "packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.27,<0.29",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "db: needs PostgreSQL/TimescaleDB and Redis (see docs/testing/testing.md)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["B008", "E501"]  # line length is enforced by the formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311", "E501"]
"packages/device-adapters/src/solarmind_adapters/mock.py" = ["S311"]
"apps/simulator/*" = ["S311", "ASYNC240"]

[tool.ruff.lint.isort]
known-first-party = ["solarmind_api", "solarmind_schemas", "solarmind_energy", "solarmind_adapters", "solarmind_agents", "solarmind_simulator", "tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
